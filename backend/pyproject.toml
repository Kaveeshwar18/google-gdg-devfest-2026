[project]
name = "passport-mitra-backend"
version = "0.1.0"
description = "Passport Mitra API: FastAPI + LangGraph stuck-case solver, speech and status services"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.13.0",
    "chromadb>=1.5.9",
    "fastapi>=0.143.0",
    "google-genai>=2.29.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.14",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "sarvamai>=0.1.36",
    "sentence-transformers>=6.1.0",
    "sse-starlette>=3.5.0",
    "torch>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# CPU-only torch on Linux (CI, Docker, Render): avoids ~2.5 GB of CUDA wheels. macOS uses PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
